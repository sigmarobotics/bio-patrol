services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio-patrol
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:rw
    networks:
      - bio-patrol-net
    depends_on:
      - mqtt-broker

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bio-patrol-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - bio-patrol-net

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: bio-patrol-z2m
    restart: unless-stopped
    # privileged + /dev:/dev so the host udev rule (99-zigbee.rules)
    # SYMLINK+="zigbee" survives a dongle unplug+replug without operator
    # intervention. Static `devices:` mapping was stuck at the old inode
    # after replug — see CORNER-008. Trade-off: full host-device access;
    # acceptable on a single-tenant appliance. See docs/buttons-manual.md §2.2.
    privileged: true
    volumes:
      - ./zigbee2mqtt:/app/data
      - /dev:/dev
    environment:
      - TZ=Asia/Taipei
    ports:
      - "8080:8080"
    healthcheck:
      # Surfaces missing udev symlink as `unhealthy` in `docker ps` so a fresh
      # host without the rule installed doesn't masquerade as healthy.
      test: ["CMD-SHELL", "test -e /dev/zigbee"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - mqtt-broker
    networks:
      - bio-patrol-net

networks:
  bio-patrol-net:
    driver: bridge
