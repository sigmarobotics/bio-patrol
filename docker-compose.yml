services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio-patrol
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:rw
      # Read side of the z2m config snapshotter; the write side (snapshots)
      # lands under ./data above, which z2m mounts back as /snapshots:ro.
      - ./zigbee2mqtt:/z2m-data:ro
    environment:
      - Z2M_DATA_DIR=/z2m-data
      - Z2M_SNAPSHOT_DIR=/app/data/z2m-snapshots
    networks:
      - bio-patrol-net
    depends_on:
      - mqtt-broker

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bio-patrol-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - bio-patrol-net

  zigbee2mqtt:
    # Pinned: overriding entrypoint wipes the image CMD, so `command` below
    # restores it verbatim — and that value is version-specific (2.13.0
    # docker/Dockerfile). Re-check it on every version bump.
    image: koenkk/zigbee2mqtt:2.13.0
    container_name: bio-patrol-z2m
    restart: unless-stopped
    # Restore must live inside z2m's own startup path: a one-shot compose
    # service only runs on `compose up`, while a power-cut reboot has dockerd
    # re-launch the container straight from the restart policy. `$$@` is
    # compose escaping so the in-container sh sees `$@`.
    entrypoint: ["/bin/sh", "-c", "sh /z2m-restore.sh || echo '[restore] failed, starting anyway'; exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["/sbin/tini", "--", "node", "index.js"]
    # privileged + /dev:/dev so the host udev rule (99-zigbee.rules)
    # SYMLINK+="zigbee" survives a dongle unplug+replug without operator
    # intervention. Static `devices:` mapping was stuck at the old inode
    # after replug — see CORNER-008. Trade-off: full host-device access;
    # acceptable on a single-tenant appliance. See docs/buttons-manual.md §2.2.
    privileged: true
    volumes:
      - ./zigbee2mqtt:/app/data
      - /dev:/dev
      - ./deploy/z2m-restore.sh:/z2m-restore.sh:ro
      - ./data/z2m-snapshots:/snapshots:ro
    environment:
      - TZ=Asia/Taipei
    ports:
      - "8080:8080"
    healthcheck:
      # Surfaces missing udev symlink as `unhealthy` in `docker ps` so a fresh
      # host without the rule installed doesn't masquerade as healthy.
      test: ["CMD-SHELL", "test -e /dev/zigbee"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - mqtt-broker
    networks:
      - bio-patrol-net

networks:
  bio-patrol-net:
    driver: bridge
