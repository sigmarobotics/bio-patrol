[project]
name = "bio-patrol"
version = "1.0.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "grpcio==1.66.1",
    "kachaka-api>=3.16,<4",
    "protobuf==5.27.2",
    "paho-mqtt==2.1.0",
    "httpx>=0.27.0",
    "uvicorn==0.34.0",
    "apscheduler>=3.10.4",
    # >=0.7: poll_until_complete verifies command_id; mcp moved to optional
    # extra so the toolkit no longer forces the mcp->starlette stack
    "kachaka-sdk-toolkit>=0.6.1,<0.8",
    # Explicit guard: toolkit <0.7 pulls mcp (unbounded) -> starlette; a
    # future `uv lock --upgrade` must fail loudly instead of drifting past
    # fastapi 0.115.6's starlette<0.42 requirement
    "starlette>=0.40,<0.42",
    "aiomqtt>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
