# 兩個 listener（per_listener_settings）：
#   1883 = compose 內網（app / z2m / 按鈕），匿名，與以前相同
#   1884 = 電子白板廠商專線；compose 把它綁在 eth0 專線 IP 10.77.0.1，帳密＋唯讀 ACL
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

listener 1884
allow_anonymous false
password_file /mosquitto/config/board.passwd
acl_file /mosquitto/config/board.acl
