services:
  app:
    image: ghcr.io/sigma-snaken/bio-patrol:main
    container_name: bio-patrol
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:rw
    networks:
      - bio-patrol-net
    depends_on:
      - mqtt-broker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bio-patrol-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - bio-patrol-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: bio-patrol-z2m
    restart: unless-stopped
    # privileged + /dev:/dev so the host's udev rule (99-zigbee.rules)
    # SYMLINK+="zigbee" → /dev/zigbee survives dongle unplug + replug
    # without operator intervention. Static `devices:` mapping was stuck
    # at the old inode after replug — see CORNER-008.
    privileged: true
    volumes:
      - ./zigbee2mqtt:/app/data
      - /dev:/dev
    environment:
      - TZ=Asia/Taipei
      - ZIGBEE_SERIAL_PORT=/dev/zigbee
    ports:
      - "8080:8080"
    depends_on:
      - mqtt-broker
    networks:
      - bio-patrol-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mosquitto-data:

networks:
  bio-patrol-net:
    driver: bridge
